spring.application.name=banksystem
server.port=${SERVER_PORT:9090}


spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${MYSQL_DATABASE}
spring.datasource.username=${DB_USER}
spring.datasource.password=${MYSQL_ROOT_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

app.config.user.activation-code-expires-day=${ACTIVATION_CODE_EXPIRES_DAY:1}
app.config.system.base-currency-code=${BASE_CURRENCY_CODE:USD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:true}

spring.jpa.properties.hibernate.jdbc.batch_size=${JDBC_BATCH_SIZE:50}
spring.jpa.properties.hibernate.order_inserts=${HIBERNATE_ORDER_INSERTS:true}
spring.jpa.properties.hibernate.order_updates=${HIBERNATE_ORDER_UPDATES:true}

app.system.card.encryption.keys[1]=${CARD_AUTH_KEY1}
app.system.card.encryption.key-version=${CARD_KEY_VERSION:1}

app.system.card.config.card-expires-year=${CARD_EXPIRES_YEAR:2}
app.system.card.config.delivered-status-expires-day=${CARD_DELIVERED_STATUS_EXPIRES_DAY:1}
app.system.card.config.reference-code-expires-hour=${CARD_REFERENCE_CODE_EXPIRES_HOUR:1}

app.system.transaction.expires-day=${TRANSACTION_EXPIRES_DAY:14}
app.system.overdraft.request.expires-day=${OVERDRAFT_REQUEST_EXPIRES_DAY:14}

app.system.overdraft.account.allowed-non-active-account=${ALLOWED_NON_ACTIVE_ACCOUNT_ON_OVERDRAFT_PAYBACK:true}

app.system.loan.default-DueDays=${LOAN_DEFAULT_DUE_DAYS:30}

app.system.internal.api-key=${API_KEY}

app.system.accesssession.access-life-time-minute=${ACCESS_SESSION_LIFE_TIME_MINUTE:10}
app.system.accesssession.blacklist-life-time-minute=${ACCESS_SESSION_BLACKLIST_LIFE_TIME_MINUTE:12}
app.system.accesssession.payment-life-time-minute=${ACCESS_SESSION_PAYMENT_LIFE_TIME_MINUTE:1}
app.system.accesssession.refreshable-threshold-minute=${ACCESS_SESSION_REFRESHABLE_THRESHOLD_MINUTE:3}
app.system.accesssession.two-factor-code-expires-minute=${ACCESS_SESSION_TWO_FACTOR_CODE_EXPIRES_MINUTE:2}


app.system.authentication.attempt-expires-minute=${AUTHENTICATION_ATTEMPT_EXPIRES_MINUTE:3}
app.system.authentication.max-attempt=${AUTHENTICATION_MAX_ATTEMPT:3}

app.system.twilio.account-id=${TWILIO_ACCOUNT_ID}
app.system.twilio.auth-token=${TWILIO_AUTH_TOKEN}
app.system.twilio.service-id=${TWILIO_SERVICE_ID}

app.system.caching.accesssession.key-prefixed=${ACCESS_SESSION_KEY_PREFIX:accessSession:}
app.system.caching.accesssession.pending-delete-expires-minute=${ACCESS_SESSION_PENDING_DELETE_EXPIRES_MINUTE:20}
app.system.caching.accesssession.bulk-revoke-element-limit=${ACCESS_SESSION_BULK_REVOKE_ELEMENT_LIMIT:50}

app.redis.connection-time-out-second=${REDIS_CONNECTION_TIMEOUT_SECOND:2}
app.redis.command-time-out-second=${REDIS_COMMAND_TIMEOUT_SECOND:2}
app.redis.code-connection-time-out-second=${REDIS_CODE_CONNECTION_TIMEOUT_SECOND:2}

app.system.ratelimiting.delete-after-access-minute=${RATE_LIMIT_DELETE_AFTER_ACCESS_MINUTE:10}

app.system.ratelimiting.api-rate-key-prefixed=${API_RATE_KEY_PREFIX:apiRateLimit:}
app.system.ratelimiting.auth-rate-key-prefixed=${AUTH_RATE_KEY_PREFIX:authRateLmit:}
app.system.ratelimiting.twofactor-rate-key-prefixed=${TWO_FACTOR_RATE_KEY_PREFIX:twoFactorRateLmit:}
app.system.ratelimiting.request-rate-key-prefixed=${REQUEST_RATE_KEY_PREFIX:requestRateLmit:}

app.system.ratelimiting.global-api-rate-key-prefixed=${GLOBAL_API_RATE_KEY_PREFIX:globalApiRateLmit:all}
app.system.ratelimiting.global-auth-rate-key-prefixed=${GLOBAL_AUTH_RATE_KEY_PREFIX:globalAuthRateLmit:all}
app.system.ratelimiting.global-twofactor-rate-key-prefixed=${GLOBAL_TWO_FACTOR_RATE_KEY_PREFIX:globalTwoFactorRateLmit:all}
app.system.ratelimiting.global-request-rate-key-prefixed=${GLOBAL_REQUEST_RATE_KEY_PREFIX:globalRequestRateLmit:all}


app.system.ratelimiting.api.max-capacity=${API_RATE_MAX_CAPACITY:5}
app.system.ratelimiting.api.refill-amount=${API_RATE_REFILL_AMOUNT:5}
app.system.ratelimiting.api.minute-per-refill=${API_RATE_MINUTE_PER_REFILL:1}
app.system.ratelimiting.api.global-max-capacity=${API_GLOBAL_RATE_MAX_CAPACITY:10000}
app.system.ratelimiting.api.global-refill-amount=${API_GLOBAL_RATE_REFILL_AMOUNT:1000}
app.system.ratelimiting.api.global-minute-per-refill=${API_GLOBAL_RATE_MINUTE_PER_REFILL:2}

app.system.ratelimiting.authentication.max-capacity=${AUTH_RATE_MAX_CAPACITY:3}
app.system.ratelimiting.authentication.refill-amount=${AUTH_RATE_REFILL_AMOUNT:3}
app.system.ratelimiting.authentication.minute-per-refill=${AUTH_RATE_MINUTE_PER_REFILL:5}
app.system.ratelimiting.authentication.global-max-capacity=${AUTH_GLOBAL_RATE_MAX_CAPACITY:500}
app.system.ratelimiting.authentication.global-refill-amount=${AUTH_GLOBAL_RATE_REFILL_AMOUNT:50}
app.system.ratelimiting.authentication.global-minute-per-refill=${AUTH_GLOBAL_RATE_MINUTE_PER_REFILL:1}

app.system.ratelimiting.twofactor.max-capacity=${TWO_FACTOR_RATE_MAX_CAPACITY:3}
app.system.ratelimiting.twofactor.refill-amount=${TWO_FACTOR_RATE_REFILL_AMOUNT:1}
app.system.ratelimiting.twofactor.minute-per-refill=${TWO_FACTOR_RATE_MINUTE_PER_REFILL:1}
app.system.ratelimiting.twofactor.global-max-capacity=${TWO_FACTOR_GLOBAL_RATE_MAX_CAPACITY:5000}
app.system.ratelimiting.twofactor.global-refill-amount=${TWO_FACTOR_GLOBAL_RATE_REFILL_AMOUNT:1000}
app.system.ratelimiting.twofactor.global-minute-per-refill=${TWO_FACTOR_GLOBAL_RATE_MINUTE_PER_REFILL:5}

app.system.ratelimiting.request.max-capacity=${REQUEST_RATE_MAX_CAPACITY:3}
app.system.ratelimiting.request.refill-amount=${REQUEST_RATE_REFILL_AMOUNT:1}
app.system.ratelimiting.request.minute-per-refill=${REQUEST_RATE_MINUTE_PER_REFILL:1}
app.system.ratelimiting.request.global-max-capacity=${REQUEST_GLOBAL_RATE_MAX_CAPACITY:2000}
app.system.ratelimiting.request.global-refill-amount=${REQUEST_GLOBAL_RATE_REFILL_AMOUNT:200}
app.system.ratelimiting.request.global-minute-per-refill=${REQUEST_GLOBAL_RATE_MINUTE_PER_REFILL:2}


spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:2026}


spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}

spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}