spring.application.name=banksystem
server.port=${SERVER_PORT}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_NAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

app.config.user.activation-code-expires-day=1
app.config.system.base-currency-code=USD

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

app.system.card.encryption.keys[1]=${CARD_AUTH_KEY1}
app.system.card.encryption.key-version=1

app.system.card.config.card-expires-year=2
app.system.card.config.delivered-status-expires-day=1
app.system.card.config.reference-code-expires-hour=1

app.system.transaction.expires-day=14
app.system.overdraft.request.expires-day=14

app.system.overdraft.account.allowed-non-active-account=true

app.system.loan.default-DueDays=30

app.system.internal.api-key=${API_KEY}
app.system.accesssession.access-life-time-minute=10
app.system.accesssession.blacklist-life-time-minute=12
app.system.accesssession.payment-life-time-minute=1
app.system.accesssession.refreshable-threshold-minute=3
app.system.accesssession.two-factor-code-expires-minute=2

app.system.authentication.attempt-expires-minute=3
app.system.authentication.max-attempt=3

app.system.twilio.account-id=${TWILIO_ACCOUNT_ID}
app.system.twilio.auth-token=${TWILIO_AUTH_TOKEN}
app.system.twilio.service-id=${TWILIO_SERVICE_ID}

app.system.caching.accesssession.key-prefixed=accessSession:
app.system.caching.accesssession.pending-delete-expires-minute=20
app.system.caching.accesssession.bulk-revoke-element-limit=50

app.redis.connection-time-out-second=2
app.redis.command-time-out-second=2
app.redis.code-connection-time-out-second=2

app.system.ratelimiting.delete-after-access-minute=10

app.system.ratelimiting.api-rate-key-prefixed=apiRateLimit:
app.system.ratelimiting.auth-rate-key-prefixed=authRateLmit:
app.system.ratelimiting.twofactor-rate-key-prefixed=twoFactorRateLmit:
app.system.ratelimiting.request-rate-key-prefixed=requestRateLmit:
app.system.ratelimiting.global-api-rate-key-prefixed=globalApiRateLmit:all
app.system.ratelimiting.global-auth-rate-key-prefixed=globalAuthRateLmit:all
app.system.ratelimiting.global-twofactor-rate-key-prefixed=globalTwoFactorRateLmit:all
app.system.ratelimiting.global-request-rate-key-prefixed=globalRequestRateLmit:all

app.system.ratelimiting.api.max-capacity=5
app.system.ratelimiting.api.refill-amount=5
app.system.ratelimiting.api.minute-per-refill=1
app.system.ratelimiting.api.global-max-capacity=10000
app.system.ratelimiting.api.global-refill-amount=1000
app.system.ratelimiting.api.global-minute-per-refill=2

app.system.ratelimiting.authentication.max-capacity=3
app.system.ratelimiting.authentication.refill-amount=3
app.system.ratelimiting.authentication.minute-per-refill=5
app.system.ratelimiting.authentication.global-max-capacity=500
app.system.ratelimiting.authentication.global-refill-amount=50
app.system.ratelimiting.authentication.global-minute-per-refill=1

app.system.ratelimiting.twofactor.max-capacity=3
app.system.ratelimiting.twofactor.refill-amount=1
app.system.ratelimiting.twofactor.minute-per-refill=1
app.system.ratelimiting.twofactor.global-max-capacity=5000
app.system.ratelimiting.twofactor.global-refill-amount=1000
app.system.ratelimiting.twofactor.global-minute-per-refill=5

app.system.ratelimiting.request.max-capacity=3
app.system.ratelimiting.request.refill-amount=1
app.system.ratelimiting.request.minute-per-refill=1
app.system.ratelimiting.request.global-max-capacity=2000
app.system.ratelimiting.request.global-refill-amount=200
app.system.ratelimiting.request.global-minute-per-refill=2

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}


spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.auth=true