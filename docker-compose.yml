
services:
  mysql:
    image: mysql:8.0
    container_name: bank_engine_db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
  app:
    build: .
    container_name: bank_engine_backend
    restart: no
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "9090:9090"
    depends_on:
      - mysql
  redis:
    image: redis:8
    container_name: backend_redis
    ports:
      - "2026:6379"

volumes:
  mysql_data: